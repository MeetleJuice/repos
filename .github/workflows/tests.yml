name: Workbench checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - name: Check the extracted distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python package.py
          python - <<'PY'
          import subprocess, sys, tempfile, zipfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as temp:
              with zipfile.ZipFile('artifacts/Idea-Foundry.zip') as archive:
                  archive.extractall(temp)
              subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-q'], cwd=Path(temp) / 'Idea-Foundry', check=True)
          PY
