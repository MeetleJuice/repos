name: Workbench checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - name: Check the extracted distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python package.py
          python - <<'PY'
          import subprocess, sys, tempfile, zipfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as temp:
              with zipfile.ZipFile('artifacts/Idea-Foundry.zip') as archive:
                  archive.extractall(temp)
              subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-q'], cwd=Path(temp) / 'Idea-Foundry', check=True)
          PY
      - name: Check typed planning modules
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install mypy==1.18.2
          python -m mypy --strict forge/contracts.py forge/planning.py forge/routing.py forge/schemas.py forge/models.py forge/evidence.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_arcade_check.py
      - run: python tests/browser_proposal_import_check.py
      - run: python tests/browser_starter_recovery_check.py
      - run: python tests/browser_planning_check.py
      - run: python tests/browser_upgrade_check.py
