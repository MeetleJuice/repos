<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes App</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main><span class="eyebrow">IDEA FOUNDRY / NOTES APP</span><h1>A place for<br><em>your thoughts.</em></h1><p class="intro">Write it down. Find it later. Saved on this computer.</p><form id="note-form"><label for="title">Title</label><input id="title" required maxlength="300" placeholder="A thought worth keeping"><label for="body">Your note</label><textarea id="body" maxlength="20000" placeholder="Start writing…"></textarea><button id="add-note" type="submit">Save note +</button></form><p id="message" role="status" hidden></p><div class="toolbar"><label for="search">Your notes <span id="count"></span></label><input id="search" type="search" placeholder="Search titles…"></div><section id="notes" aria-label="Saved notes"></section><p id="empty" hidden>No notes yet. Write your first one above.</p><footer>LOCAL FIRST · Notes stay saved after you close the app.</footer></main></body></html>
