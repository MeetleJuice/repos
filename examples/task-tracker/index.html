<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Tracker</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main><div class="eyebrow">IDEA FOUNDRY / YOUR FIRST APP</div><h1>A little more<br><em>done.</em></h1><p class="intro">A simple home for everything on your list. Saved on this computer.</p><form id="add-form"><label class="sr-only" for="title">New task</label><input id="title" placeholder="What needs doing?" maxlength="300" required autocomplete="off"><button id="add" aria-label="Add task" type="submit">Add task +</button></form><p id="message" role="status" hidden></p><div class="toolbar"><span id="count">Loading tasks…</span><div class="filters" aria-label="Filter tasks"><button data-filter="all" class="selected" aria-pressed="true">All</button><button data-filter="active" aria-pressed="false">Active</button><button data-filter="done" aria-pressed="false">Done</button></div></div><ul id="tasks" aria-label="Tasks"></ul><p id="empty" hidden>Your list is clear. Add something above.</p><footer>LOCAL FIRST · Your tasks stay here, even after a restart.</footer></main></body></html>
